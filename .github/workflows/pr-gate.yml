name: PR Gate

on:
  pull_request:
    # The trunk. This was `dev` — a branch that has never existed in this
    # repository, so the gate could not fire on any pull request at all.
    branches: [master-build/phase-0-1]

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      # Fake CI-only values — never real secrets, never used to actually
      # connect to anything. They only exist so `next build`'s static
      # analysis of routes like /api/auth/[...nextauth] doesn't throw on
      # missing env vars. Jenkins has the REAL .env on the server already.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
      AUTH_SECRET: "ci-fake-secret-not-real-00000000000000000000"
      AUTH_URL: "http://localhost:8765/api/auth"
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_BASE_PATH: ""
      WEBHOOK_SECRET: "ci-fake-webhook-secret"
      KEYCLOAK_ISSUER: "http://localhost:8080/realms/ci"
      KEYCLOAK_CLIENT_ID: "ci-fake-client-id"
      KEYCLOAK_ROLE_CLIENT_ID: "ci-fake-client-id"
      KEYCLOAK_CLIENT_SECRET: "ci-fake-client-secret"
      KEYCLOAK_ADMIN_CLIENT_ID: "ci-fake-admin-client-id"
      KEYCLOAK_ADMIN_CLIENT_SECRET: "ci-fake-admin-client-secret"
      KEYCLOAK_REALM: "ci"
      KEYCLOAK_POST_LOGOUT_REDIRECT_URI: "http://localhost:8765/login"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint || true

      - run: node scripts/check-api-guards.mjs

      - run: node scripts/verify-behaviors.mjs

      # Tenancy lint: fails on tenant-identity branching and hardcoded Odisha
      # literals that should live in tenant config. Currently NON-BLOCKING — it
      # reports the Phase 1 extraction backlog in the CI logs. Flip to a hard
      # gate (remove `|| true`) once the backlog reaches zero.
      - run: node scripts/check-tenancy-lint.mjs || true

      # The filesystem-only legs of the golden harness. Each reads the source
      # tree and nothing else — no database, no running server — so they cost
      # seconds and are safe on a hosted runner. They run BEFORE the build so a
      # violation reports in seconds rather than after a full compile.
      #
      # The remaining golden legs (vitest, check-tenant-integrity,
      # check-http-smoke, check-a11y) need a seeded Postgres and a booted app,
      # so they stay on Jenkins and in the local `npm run golden` run.

      # Reskinned surfaces resolve every colour through a Nocturne role token;
      # one hardcoded hex silently breaks per-tenant theming for that element.
      - run: node scripts/check-no-hardcoded-color.mjs

      # Every route maps to a module or an always-on core rule, so a new screen
      # cannot ship ungated by entitlement.
      - run: npx tsx scripts/check-route-module-map.ts

      # No unscoped Prisma client or raw SQL escapes the tenant chokepoint.
      - run: node scripts/check-tenant-chokepoint.mjs

      - run: npm run build

      # Reads .next/server/functions-config-manifest.json to confirm every route
      # is actually covered by the middleware matcher — so it must run after the
      # build, not with the static checks above.
      - run: node scripts/check-proxy-matcher.mjs