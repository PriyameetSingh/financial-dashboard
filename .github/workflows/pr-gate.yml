name: PR Gate

on:
  pull_request:
    branches: [dev]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint || true        # non-blocking (pre-existing errors, same as Jenkins)

      - run: node scripts/verify-behaviors.mjs   # THE GATE — fails → PR blocked

      - run: npm run build               # catches TypeScript/compile errors