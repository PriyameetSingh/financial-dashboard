# Add this location block inside the server {} block for product.airawat.org
# (typically in /etc/nginx/sites-available/product.airawat.org or similar)

location /hudd-dashboard {
    proxy_pass          http://13.203.18.97:8765;
    proxy_http_version  1.1;

    # Required for WebSockets (Next.js HMR / Server-Sent Events)
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Forward original host/IP so Auth.js trust-host works correctly
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;

    # Increase timeouts for slow API responses
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
}
